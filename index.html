<!DOCTYPE html>
<html lang="en" class="dark">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Sausage Tools | Inventory & Spot Checker</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script>
        tailwind.config = {
            darkMode: 'class',
            theme: {
                extend: {
                    colors: {
                        gray: {
                            900: '#111827',
                            800: '#1f2937',
                            700: '#374151',
                            100: '#f3f4f6'
                        }
                    }
                }
            }
        }
    </script>
    <style>
        /* Touch target optimizations and hiding scrollbars */
        ::-webkit-scrollbar { display: none; }
        body { -ms-overflow-style: none; scrollbar-width: none; -webkit-tap-highlight-color: transparent; overscroll-behavior-y: contain; }
        .touch-target { min-height: 48px; min-width: 48px; }
    </style>
</head>
<body class="bg-gray-900 text-gray-100 font-sans antialiased h-screen flex flex-col">

    <!-- HEADER -->
    <header class="bg-gray-800 shadow-md p-4 flex justify-between items-center z-20 shrink-0">
        <div>
            <a href="https://sausage.allen.tools" class="text-blue-400 text-sm font-semibold mb-1 block touch-target flex items-center">← Back to Hub</a>
            <h1 class="text-lg font-bold leading-tight">Inventory & Spot Checker</h1>
        </div>
        <button id="btn-config" class="touch-target p-2 bg-gray-700 rounded-full hover:bg-gray-600 focus:outline-none focus:ring-2 focus:ring-blue-500">
            <!-- Gear Icon -->
            <svg class="w-6 h-6 text-gray-200" fill="none" stroke="currentColor" viewBox="0 0 24 24" xmlns="http://www.w3.org/2000/svg"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M10.325 4.317c.426-1.756 2.924-1.756 3.35 0a1.724 1.724 0 002.573 1.066c1.543-.94 3.31.826 2.37 2.37a1.724 1.724 0 001.065 2.572c1.756.426 1.756 2.924 0 3.35a1.724 1.724 0 00-1.066 2.573c.94 1.543-.826 3.31-2.37 2.37a1.724 1.724 0 00-2.572 1.065c-.426 1.756-2.924 1.756-3.35 0a1.724 1.724 0 00-2.573-1.066c-1.543.94-3.31-.826-2.37-2.37a1.724 1.724 0 00-1.065-2.572c-1.756-.426-1.756-2.924 0-3.35a1.724 1.724 0 001.066-2.573c-.94-1.543.826-3.31 2.37-2.37.996.608 2.296.07 2.572-1.065z"></path><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M15 12a3 3 0 11-6 0 3 3 0 016 0z"></path></svg>
        </button>
    </header>

    <!-- MAIN CONTENT AREA -->
    <main class="flex-1 overflow-y-auto relative pb-24 p-4" id="main-content">
        
        <!-- INITIAL LOADING STATE -->
        <div id="loading-state" class="flex flex-col items-center justify-center h-full hidden">
            <div class="animate-spin rounded-full h-12 w-12 border-b-2 border-blue-500 mb-4"></div>
            <p class="text-gray-400">Syncing with Google Sheets...</p>
        </div>

        <!-- INTERACTIVE SEARCH BAR -->
        <div id="search-container" class="sticky top-0 z-10 bg-gray-900 pb-3 pt-1">
            <div class="relative">
                <input type="text" id="search-input" placeholder="🔍 Search items by letters or ID..." 
                    autocomplete="off" autocorrect="off" autocapitalize="off" spellcheck="false"
                    class="w-full bg-gray-800 border border-gray-700 rounded-xl px-4 py-3 pl-10 text-white placeholder-gray-400 focus:outline-none focus:border-blue-500 focus:ring-1 focus:ring-blue-500 touch-target text-base shadow-sm">
                <svg class="w-5 h-5 text-gray-400 absolute left-3 top-3.5" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                    <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M21 21l-6-6m2-5a7 7 0 11-14 0 7 7 0 0114 0z"></path>
                </svg>
                <button id="clear-search" class="hidden absolute right-3 top-3 text-gray-400 hover:text-white touch-target p-1">
                    <svg class="w-6 h-6" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M6 18L18 6M6 6l12 12"></path></svg>
                </button>
            </div>
        </div>

        <!-- LIST CONTAINER -->
        <div id="inventory-list" class="space-y-4 mt-2">
            <!-- Items injected here by JS -->
            <div class="text-center text-gray-500 mt-10" id="empty-state">
                <p>No items loaded.</p>
                <p class="text-sm mt-2">Tap the gear icon to configure your Cloudflare Worker URL.</p>
            </div>
        </div>
        
    </main>

    <!-- FLOATING SYNC BUTTON -->
    <div class="fixed bottom-[80px] right-4 z-30">
        <button id="btn-sync" class="bg-blue-600 hover:bg-blue-700 text-white font-bold rounded-full shadow-lg p-4 flex items-center justify-center hidden touch-target">
            <svg class="w-6 h-6 mr-2" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M4 4v5h.582m15.356 2A8.001 8.001 0 004.582 9m0 0H9m11 11v-5h-.581m0 0a8.003 8.003 0 01-15.357-2m15.357 2H15"></path></svg>
            Sync to Sheet
        </button>
    </div>

    <!-- BOTTOM TAB NAVIGATION -->
    <nav class="bg-gray-800 shadow-[0_-4px_6px_-1px_rgba(0,0,0,0.1)] flex justify-around shrink-0 fixed bottom-0 w-full z-20 pb-safe">
        <button class="tab-btn flex-1 py-3 text-blue-400 border-t-2 border-blue-400 touch-target flex flex-col items-center" data-tab="full">
            <svg class="w-6 h-6 mb-1" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M9 5H7a2 2 0 00-2 2v12a2 2 0 002 2h10a2 2 0 002-2V7a2 2 0 00-2-2h-2M9 5a2 2 0 002 2h2a2 2 0 002-2M9 5a2 2 0 012-2h2a2 2 0 012 2m-3 7h3m-3 4h3m-6-4h.01M9 16h.01"></path></svg>
            <span class="text-xs font-semibold">Full Count</span>
        </button>
        <button class="tab-btn flex-1 py-3 text-gray-400 border-t-2 border-transparent touch-target flex flex-col items-center" data-tab="spot">
            <svg class="w-6 h-6 mb-1" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M13 10V3L4 14h7v7l9-11h-7z"></path></svg>
            <span class="text-xs font-semibold">Spot Check</span>
        </button>
        <button class="tab-btn flex-1 py-3 text-gray-400 border-t-2 border-transparent touch-target flex flex-col items-center" data-tab="waste">
            <svg class="w-6 h-6 mb-1" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M19 7l-.867 12.142A2 2 0 0116.138 21H7.862a2 2 0 01-1.995-1.858L5 7m5 4v6m4-6v6m1-10V4a1 1 0 00-1-1h-4a1 1 0 00-1 1v3M4 7h16"></path></svg>
            <span class="text-xs font-semibold">Waste Log</span>
        </button>
    </nav>

    <!-- CONFIG MODAL OVERLAY -->
    <div id="config-modal" class="fixed inset-0 bg-black bg-opacity-70 z-50 hidden flex flex-col justify-end">
        <div class="bg-gray-800 rounded-t-2xl p-6 w-full max-h-[90vh] overflow-y-auto">
            <div class="flex justify-between items-center mb-6">
                <h2 class="text-xl font-bold">System Configuration</h2>
                <button id="close-config" class="text-gray-400 hover:text-white touch-target">
                    <svg class="w-8 h-8" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M6 18L18 6M6 6l12 12"></path></svg>
                </button>
            </div>
            
            <div class="space-y-4">
                <div>
                    <label class="block text-sm font-medium text-gray-400 mb-1">Worker or Apps Script URL</label>
                    <input type="url" id="input-url" class="w-full bg-gray-900 border border-gray-700 rounded p-3 text-white focus:outline-none focus:border-blue-500 touch-target" placeholder="https://inventory-worker.allen-tools.workers.dev">
                </div>
                <div>
                    <label class="block text-sm font-medium text-gray-400 mb-1">Passcode (API Key)</label>
                    <input type="password" id="input-passcode" class="w-full bg-gray-900 border border-gray-700 rounded p-3 text-white focus:outline-none focus:border-blue-500 touch-target" placeholder="Enter your secret passcode">
                </div>
                
                <div class="pt-4">
                    <button id="save-config" class="w-full bg-blue-600 hover:bg-blue-700 text-white font-bold rounded p-4 touch-target">Save & Fetch Inventory</button>
                </div>
            </div>
        </div>
    </div>

    <script>
        // State
        let state = {
            url: localStorage.getItem('inv_url') || '',
            passcode: localStorage.getItem('inv_passcode') || '',
            items: [],
            currentMode: 'full', // full, spot, waste
            searchQuery: ''
        };

        // Helper to extract properties from Google Sheet row regardless of exact header naming
        function getProp(obj, ...keys) {
            if (!obj) return '';
            for (const k of keys) {
                if (obj[k] !== undefined && obj[k] !== null && String(obj[k]).trim() !== '') {
                    return String(obj[k]).trim();
                }
            }
            const lowerKeys = Object.keys(obj);
            for (const target of keys) {
                const cleanTarget = target.toLowerCase().replace(/[^a-z0-9]/g, '');
                for (const k of lowerKeys) {
                    if (k.toLowerCase().replace(/[^a-z0-9]/g, '') === cleanTarget) {
                        if (obj[k] !== undefined && obj[k] !== null && String(obj[k]).trim() !== '') {
                            return String(obj[k]).trim();
                        }
                    }
                }
            }
            return '';
        }

        // DOM Elements
        const DOM = {
            configBtn: document.getElementById('btn-config'),
            configModal: document.getElementById('config-modal'),
            closeConfig: document.getElementById('close-config'),
            saveConfig: document.getElementById('save-config'),
            inputUrl: document.getElementById('input-url'),
            inputPasscode: document.getElementById('input-passcode'),
            inventoryList: document.getElementById('inventory-list'),
            loadingState: document.getElementById('loading-state'),
            emptyState: document.getElementById('empty-state'),
            syncBtn: document.getElementById('btn-sync'),
            tabs: document.querySelectorAll('.tab-btn'),
            searchInput: document.getElementById('search-input'),
            clearSearch: document.getElementById('clear-search')
        };

        // Initialization
        function init() {
            DOM.inputUrl.value = state.url;
            DOM.inputPasscode.value = state.passcode;
            
            bindEvents();
            
            if(state.url && state.passcode) {
                fetchInventory();
            }
        }

        function bindEvents() {
            DOM.configBtn.addEventListener('click', () => DOM.configModal.classList.remove('hidden'));
            DOM.closeConfig.addEventListener('click', () => DOM.configModal.classList.add('hidden'));
            DOM.saveConfig.addEventListener('click', saveConfig);
            DOM.syncBtn.addEventListener('click', syncToSheet);
            
            DOM.tabs.forEach(tab => {
                tab.addEventListener('click', (e) => {
                    const mode = e.currentTarget.dataset.tab;
                    switchMode(mode);
                });
            });

            // Instant Real-Time Search across all typing/input events
            const handleSearch = (e) => {
                state.searchQuery = e.target.value.toLowerCase().trim();
                if (state.searchQuery) {
                    DOM.clearSearch.classList.remove('hidden');
                } else {
                    DOM.clearSearch.classList.add('hidden');
                }
                renderList();
            };

            DOM.searchInput.addEventListener('input', handleSearch);
            DOM.searchInput.addEventListener('keyup', handleSearch);
            DOM.searchInput.addEventListener('search', handleSearch);

            DOM.clearSearch.addEventListener('click', () => {
                DOM.searchInput.value = '';
                state.searchQuery = '';
                DOM.clearSearch.classList.add('hidden');
                DOM.searchInput.focus();
                renderList();
            });
        }

        function switchMode(mode) {
            state.currentMode = mode;
            // Update tab UI
            DOM.tabs.forEach(t => {
                if(t.dataset.tab === mode) {
                    t.classList.add('text-blue-400', 'border-blue-400');
                    t.classList.remove('text-gray-400', 'border-transparent');
                } else {
                    t.classList.remove('text-blue-400', 'border-blue-400');
                    t.classList.add('text-gray-400', 'border-transparent');
                }
            });
            renderList();
        }

        function saveConfig() {
            state.url = DOM.inputUrl.value.trim();
            state.passcode = DOM.inputPasscode.value.trim();
            localStorage.setItem('inv_url', state.url);
            localStorage.setItem('inv_passcode', state.passcode);
            DOM.configModal.classList.add('hidden');
            fetchInventory();
        }

        async function fetchInventory() {
            if(!state.url) return;
            
            DOM.emptyState.classList.add('hidden');
            DOM.inventoryList.innerHTML = '';
            DOM.loadingState.classList.remove('hidden');

            try {
                const res = await fetch(state.url, {
                    method: 'POST',
                    body: JSON.stringify({ action: 'read', passcode: state.passcode })
                });
                const data = await res.json();
                
                if(data.error) throw new Error(data.error);
                
                state.items = (data.items || [])
                    .map((raw, idx) => {
                        const name = getProp(raw, 'Item Name', 'Item', 'Description', 'Product', 'Product Name', 'Name');
                        const id = getProp(raw, 'ItemID', 'Item ID', 'Item #', 'Product #', 'Product Number', 'ID', 'Code', 'SKU') || `ITEM-${idx + 1}`;
                        const uom = getProp(raw, 'Unit of Measure', 'Unit', 'UOM', 'Product UOM', 'Measure') || 'Units';
                        const packSizeRaw = getProp(raw, 'Case Pack Size', 'Pack Size', 'Pack', 'Case Pack', 'Case Qty');
                        const packSize = parseFloat(packSizeRaw) || 1;
                        const currentOHRaw = getProp(raw, 'OH', 'On Hand', 'Current Stock', 'Stock', 'Qty', 'Quantity');
                        const currentOH = currentOHRaw !== '' ? currentOHRaw : '0';
                        const location = getProp(raw, 'Storage Location', 'Location', 'Category', 'Section', 'Area') || 'General Storage';
                        const highCostVal = getProp(raw, 'Is High Cost / High Priority', 'High Priority', 'High Cost', 'Priority', 'High');

                        // Fallback name if row has any non-numeric string
                        let resolvedName = name;
                        if (!resolvedName) {
                            for (const val of Object.values(raw)) {
                                if (val && typeof val === 'string' && val.trim().length > 1 && isNaN(val)) {
                                    resolvedName = val.trim();
                                    break;
                                }
                            }
                        }

                        return {
                            ...raw,
                            ItemID: id,
                            name: resolvedName || `Item #${idx + 1}`,
                            uom: uom,
                            packSize: packSize,
                            currentOH: currentOH,
                            location: location,
                            isHighPriority: highCostVal.toLowerCase().includes('yes') || highCostVal.toLowerCase().includes('true'),
                            localCases: 0,
                            localUnits: 0,
                            hasChanges: false
                        };
                    })
                    .filter(item => {
                        // Filter out completely blank rows
                        const vals = Object.values(item);
                        return vals.some(v => v !== '' && v !== null && v !== undefined && v !== 0 && v !== '0');
                    });
                
                DOM.syncBtn.classList.remove('hidden');
                renderList();
            } catch (err) {
                alert('Error fetching data: ' + err.message);
                DOM.emptyState.classList.remove('hidden');
            } finally {
                DOM.loadingState.classList.add('hidden');
            }
        }

        function renderList() {
            DOM.inventoryList.innerHTML = '';
            let filtered = state.items;
            
            if (state.currentMode === 'spot') {
                filtered = filtered.filter(i => i.isHighPriority);
            }

            // Real-time letter matching: instantly adapts list to typed characters
            if (state.searchQuery) {
                const q = state.searchQuery;
                filtered = filtered.filter(i => 
                    (i.name && i.name.toLowerCase().includes(q)) ||
                    (i.ItemID && String(i.ItemID).toLowerCase().includes(q)) ||
                    (i.location && i.location.toLowerCase().includes(q)) ||
                    (i.uom && i.uom.toLowerCase().includes(q))
                );

                // Priority sort: items starting with the query appear first
                filtered.sort((a, b) => {
                    const aStarts = (a.name || '').toLowerCase().startsWith(q);
                    const bStarts = (b.name || '').toLowerCase().startsWith(q);
                    if (aStarts && !bStarts) return -1;
                    if (!aStarts && bStarts) return 1;
                    return (a.name || '').localeCompare(b.name || '');
                });

                if (filtered.length === 0) {
                    DOM.inventoryList.innerHTML = `<div class="text-center text-gray-500 mt-10"><p>No items matching "${state.searchQuery}"</p></div>`;
                    return;
                }

                // Render matching items directly for instantaneous locating
                filtered.forEach(item => {
                    const card = createItemCard(item, true);
                    DOM.inventoryList.appendChild(card);
                });
                return;
            }

            if(filtered.length === 0) {
                DOM.inventoryList.innerHTML = `<div class="text-center text-gray-500 mt-10"><p>No items found for this view.</p></div>`;
                return;
            }

            // Group by Storage Location for standard browsing
            const grouped = {};
            filtered.forEach(item => {
                const loc = item.location || 'General Storage';
                if(!grouped[loc]) grouped[loc] = [];
                grouped[loc].push(item);
            });

            for(const [loc, items] of Object.entries(grouped)) {
                const groupHeader = document.createElement('h3');
                groupHeader.className = 'text-sm font-bold text-gray-400 border-b border-gray-700 pb-1 mt-6 mb-3 uppercase tracking-wider flex justify-between items-center';
                groupHeader.innerHTML = `<span>${loc}</span><span class="text-xs text-gray-500 font-normal">(${items.length})</span>`;
                DOM.inventoryList.appendChild(groupHeader);

                items.forEach(item => {
                    const card = createItemCard(item, false);
                    DOM.inventoryList.appendChild(card);
                });
            }
        }

        function createItemCard(item, isSearch = false) {
            const el = document.createElement('div');
            el.className = `bg-gray-800 p-4 rounded-lg shadow border transition-colors ${item.hasChanges ? 'border-blue-500 ring-1 ring-blue-500' : 'border-gray-700'}`;
            
            const uom = item.uom || 'Units';
            const packSize = item.packSize || 1;
            const displayName = item.name || 'Unnamed Item';
            const displayId = item.ItemID || '';
            const displayOH = item.currentOH || 0;

            el.innerHTML = `
                <div class="flex justify-between items-start mb-3">
                    <div class="flex-1 pr-2">
                        <div class="flex items-center space-x-2 flex-wrap">
                            <h4 class="font-bold text-white text-base leading-snug">${displayName}</h4>
                            ${isSearch ? `<span class="bg-gray-700 text-blue-300 text-[10px] font-semibold px-2 py-0.5 rounded tracking-wide uppercase">${item.location}</span>` : ''}
                        </div>
                        <p class="text-xs text-gray-400 mt-0.5">${displayId} | Pack: ${packSize} ${uom}/Case</p>
                    </div>
                    <div class="text-right shrink-0">
                        <p class="text-xs text-gray-400">Current OH</p>
                        <p class="font-mono text-sm font-semibold text-gray-200">${displayOH} ${uom}</p>
                    </div>
                </div>
                
                <div class="flex space-x-3">
                    <!-- Cases Input -->
                    <div class="flex-1 bg-gray-900 rounded-lg p-2 flex flex-col items-center">
                        <span class="text-xs text-gray-400 mb-1 font-medium">Cases</span>
                        <div class="flex items-center space-x-2 w-full justify-center">
                            <button class="bg-gray-700 active:bg-gray-600 touch-target rounded text-xl w-10 h-10 flex items-center justify-center btn-minus-cases font-bold select-none">-</button>
                            <span class="font-mono text-xl w-8 text-center cases-val font-semibold">${item.localCases}</span>
                            <button class="bg-gray-700 active:bg-gray-600 touch-target rounded text-xl w-10 h-10 flex items-center justify-center btn-plus-cases font-bold select-none">+</button>
                        </div>
                    </div>
                    
                    <!-- Loose Units Input -->
                    <div class="flex-1 bg-gray-900 rounded-lg p-2 flex flex-col items-center">
                        <span class="text-xs text-gray-400 mb-1 font-medium">Loose (${uom})</span>
                        <div class="flex items-center space-x-2 w-full justify-center">
                            <button class="bg-gray-700 active:bg-gray-600 touch-target rounded text-xl w-10 h-10 flex items-center justify-center btn-minus-units font-bold select-none">-</button>
                            <span class="font-mono text-xl w-8 text-center units-val font-semibold">${item.localUnits}</span>
                            <button class="bg-gray-700 active:bg-gray-600 touch-target rounded text-xl w-10 h-10 flex items-center justify-center btn-plus-units font-bold select-none">+</button>
                        </div>
                    </div>
                </div>
                <div class="mt-3 text-center text-sm font-semibold text-blue-400">
                    Total: <span class="total-calc">${(item.localCases * packSize) + item.localUnits}</span> ${uom}
                </div>
            `;

            // Bind +/- events
            const updateUI = () => {
                el.querySelector('.cases-val').textContent = item.localCases;
                el.querySelector('.units-val').textContent = item.localUnits;
                el.querySelector('.total-calc').textContent = (item.localCases * packSize) + item.localUnits;
                item.hasChanges = true;
                el.classList.add('border-blue-500', 'ring-1', 'ring-blue-500');
            };

            // Hold-to-repeat helper (tap = 1, hold = 5)
            function attachHold(btn, onSingle, onHold) {
                let holdTimeout = null;
                let repeatInterval = null;
                let held = false;

                const clear = () => {
                    if (holdTimeout) { clearTimeout(holdTimeout); holdTimeout = null; }
                    if (repeatInterval) { clearInterval(repeatInterval); repeatInterval = null; }
                };

                const start = () => {
                    held = false;
                    clear();
                    holdTimeout = setTimeout(() => {
                        held = true;
                        if (navigator.vibrate) navigator.vibrate(15);
                        onHold();
                        repeatInterval = setInterval(() => {
                            if (navigator.vibrate) navigator.vibrate(10);
                            onHold();
                        }, 180);
                    }, 350);
                };

                const stop = () => {
                    clear();
                };

                btn.addEventListener('mousedown', start);
                btn.addEventListener('touchstart', start, { passive: true });

                btn.addEventListener('mouseup', stop);
                btn.addEventListener('mouseleave', stop);
                btn.addEventListener('touchend', stop);
                btn.addEventListener('touchcancel', stop);

                btn.addEventListener('click', (e) => {
                    if (held) {
                        e.preventDefault();
                        e.stopPropagation();
                        held = false;
                        return;
                    }
                    onSingle();
                });
            }

            // Cases: single tap = 1, hold = repeat 1
            attachHold(
                el.querySelector('.btn-minus-cases'),
                () => { if (item.localCases > 0) { item.localCases--; updateUI(); } },
                () => { if (item.localCases > 0) { item.localCases--; updateUI(); } }
            );
            attachHold(
                el.querySelector('.btn-plus-cases'),
                () => { item.localCases++; updateUI(); },
                () => { item.localCases++; updateUI(); }
            );

            // Loose Units: single tap = 1, hold = increments/decrements by 5!
            attachHold(
                el.querySelector('.btn-minus-units'),
                () => { if (item.localUnits > 0) { item.localUnits--; updateUI(); } },
                () => {
                    if (item.localUnits > 0) {
                        item.localUnits = Math.max(0, item.localUnits - 5);
                        updateUI();
                    }
                }
            );
            attachHold(
                el.querySelector('.btn-plus-units'),
                () => { item.localUnits++; updateUI(); },
                () => { item.localUnits += 5; updateUI(); }
            );

            return el;
        }

        async function syncToSheet() {
            const changedItems = state.items.filter(i => i.hasChanges).map(i => {
                const packSize = parseInt(i.packSize) || 1;
                const totalOH = (i.localCases * packSize) + i.localUnits;
                return {
                    ItemID: i.ItemID,
                    OH_Quantity: totalOH,
                    Timestamp: new Date().toISOString()
                };
            });

            if(changedItems.length === 0) {
                alert('No changes to sync.');
                return;
            }

            const originalText = DOM.syncBtn.innerHTML;
            DOM.syncBtn.innerHTML = '<div class="animate-spin h-5 w-5 border-2 border-white border-t-transparent rounded-full mr-2"></div> Syncing...';
            DOM.syncBtn.disabled = true;

            try {
                const res = await fetch(state.url, {
                    method: 'POST',
                    body: JSON.stringify({
                        action: 'update',
                        passcode: state.passcode,
                        updates: changedItems
                    })
                });
                const data = await res.json();
                
                if(data.error) throw new Error(data.error);
                
                alert(`Successfully updated ${changedItems.length} items!`);
                // Reset changes
                state.items.forEach(i => i.hasChanges = false);
                renderList();
            } catch(err) {
                alert('Sync failed: ' + err.message);
            } finally {
                DOM.syncBtn.innerHTML = originalText;
                DOM.syncBtn.disabled = false;
            }
        }

        // Run
        init();
    </script>
</body>
</html>
